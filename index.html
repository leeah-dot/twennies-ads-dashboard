<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 메타 광고 일일 리포트 누적</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
    background: #f5f5f7;
    color: #1a1a1a;
    min-height: 100vh;
  }

  /* === TOP NAV === */
  .topnav {
    position: sticky; top: 0; z-index: 200;
    background: rgba(245,245,247,0.93);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid #e0e0e0;
    padding: 0 24px;
  }
  .topnav-inner {
    max-width: 1120px; margin: 0 auto;
    display: flex; align-items: center; gap: 0;
    height: 52px;
  }
  .logo { font-size: 15px; font-weight: 800; margin-right: 24px; white-space: nowrap; }
  .date-tabs {
    display: flex; gap: 2px; overflow-x: auto;
    scrollbar-width: none; -ms-overflow-style: none; flex: 1;
  }
  .date-tabs::-webkit-scrollbar { display: none; }
  .date-tab {
    font-size: 12px; font-weight: 600;
    padding: 6px 14px; border-radius: 8px;
    cursor: pointer; white-space: nowrap;
    border: none; background: transparent; color: #666;
    transition: all .15s;
  }
  .date-tab:hover { background: #e8e8e8; color: #1a1a1a; }
  .date-tab.active { background: #1a1a1a; color: #fff; }

  /* === MAIN === */
  .page { display: none; padding: 28px 24px 48px; }
  .page.active { display: block; }
  .container { max-width: 1120px; margin: 0 auto; }

  /* === PAGE HEADER === */
  .page-header {
    display: flex; align-items: baseline; gap: 12px;
    margin-bottom: 24px; flex-wrap: wrap;
  }
  .page-header h2 { font-size: 20px; font-weight: 800; }
  .page-header .subtitle { font-size: 12px; color: #888; }

  /* === KPI ROW === */
  .kpi-row {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 10px; margin-bottom: 24px;
  }
  .kpi-card {
    background: #fff; border-radius: 12px;
    padding: 16px 18px; border: 1px solid #e5e5e5;
  }
  .kpi-label { font-size: 10px; color: #999; margin-bottom: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
  .kpi-value { font-size: 24px; font-weight: 800; }
  .kpi-sub { font-size: 10px; color: #bbb; margin-top: 3px; }
  .kpi-card.c-red .kpi-value { color: #e03e3e; }
  .kpi-card.c-green .kpi-value { color: #1a9e5f; }
  .kpi-card.c-amber .kpi-value { color: #d97706; }

  /* === TARGET SUMMARY === */
  .target-row {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 10px; margin-bottom: 28px;
  }
  .ts-card {
    background: #fff; border-radius: 12px;
    padding: 14px 16px; border: 1px solid #e5e5e5;
  }
  .ts-name { font-size: 12px; font-weight: 700; margin-bottom: 8px; }
  .ts-row { display: flex; justify-content: space-between; font-size: 11px; color: #999; margin-bottom: 4px; }
  .ts-val { font-weight: 700; color: #1a1a1a; }
  .ts-val.red { color: #e03e3e; }
  .ts-val.green { color: #1a9e5f; }
  .ts-val.muted { color: #bbb; }

  /* === SECTION === */
  .section { margin-bottom: 28px; }
  .section-hd {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 12px;
  }
  .section-title { font-size: 14px; font-weight: 800; }
  .badge {
    font-size: 10px; font-weight: 700;
    padding: 3px 10px; border-radius: 99px;
  }
  .b-red { background: #fde8e8; color: #c0392b; }
  .b-green { background: #e0f5ec; color: #1a7f4b; }
  .b-amber { background: #fef3c7; color: #92400e; }

  /* === CARDS === */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 10px; }
  .ad-card {
    background: #fff; border-radius: 12px;
    padding: 16px 18px; border: 1px solid #e5e5e5;
    border-left-width: 4px;
  }
  .ad-card.off { border-left-color: #e03e3e; }
  .ad-card.caution { border-left-color: #f59e0b; }
  .ad-card.good { border-left-color: #1a9e5f; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .ad-name { font-size: 12px; font-weight: 700; line-height: 1.45; flex: 1; padding-right: 8px; }
  .chip {
    font-size: 10px; font-weight: 700;
    padding: 2px 7px; border-radius: 5px; white-space: nowrap; flex-shrink: 0;
  }
  .chip-hhy { background: #ede9fe; color: #5b21b6; }
  .chip-hhm { background: #dbeafe; color: #1e40af; }
  .chip-hjm { background: #fce7f3; color: #9d174d; }
  .chip-hjf { background: #d1fae5; color: #065f46; }
  .metrics { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 10px; }
  .m-label { font-size: 9px; color: #bbb; margin-bottom: 1px; font-weight: 500; }
  .m-val { font-size: 13px; font-weight: 700; }
  .m-val.red { color: #e03e3e; }
  .m-val.green { color: #1a9e5f; }
  .m-val.amber { color: #d97706; }
  .bar-row { display: flex; align-items: center; gap: 8px; }
  .bar-bg { flex: 1; height: 4px; background: #f0f0f0; border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 99px; }
  .fill-red { background: #e03e3e; }
  .fill-amber { background: #f59e0b; }
  .fill-green { background: #1a9e5f; }
  .bar-label { font-size: 10px; color: #999; font-weight: 600; white-space: nowrap; }

  .divider { height: 1px; background: #ebebeb; margin: 20px 0 24px; }

  @media (max-width: 700px) {
    .kpi-row, .target-row { grid-template-columns: repeat(2, 1fr); }
    .cards { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- TOP NAV -->
<nav class="topnav">
  <div class="topnav-inner">
    <span class="logo">📊 메타 광고 리포트</span>
    <div class="date-tabs" id="dateTabs"></div>
  </div>
</nav>

<!-- PAGES are injected here by JS -->
<div id="pages"></div>

<script>
// ============================================================
// DATA — 매일 스케줄 태스크가 새 항목을 push()합니다
// ============================================================
const REPORTS = [
  {
    date: "2026-06-30",
    label: "6월 30일",
    kpi: {
      off: 4, caution: 2, good: 8,
      totalSpend: "734만원", totalLeads: 116
    },
    targets: [
      { id:"한한여", emoji:"🟣", avg3mCPL:44439, day7CPL:61741, day7Leads:41, avg3mCTR:"1.25%", trend:"up" },
      { id:"한한남", emoji:"🔵", avg3mCPL:89455, day7CPL:80810, day7Leads:3,  avg3mCTR:"2.62%", trend:"down" },
      { id:"한일남", emoji:"🩷", avg3mCPL:47122, day7CPL:35254, day7Leads:72, avg3mCTR:"3.04%", trend:"good" },
      { id:"한일여", emoji:"🟢", avg3mCPL:128005, day7CPL:null, day7Leads:0, avg3mCTR:"1.32%", trend:"none" }
    ],
    off: [
      { name:"내 딸이면_데보라_1",        target:"한한여", cpl7:115976, cpl3m:44439, ctr:"0.92%", pct:261, barW:100 },
      { name:"[베리] 서재민_그대로",       target:"한한여", cpl7:79456,  cpl3m:44439, ctr:"1.00%", pct:179, barW:90  },
      { name:"4월 2주차_한일 남성_AI_2(1차)", target:"한일남", cpl7:77693,  cpl3m:47122, ctr:"2.88%", pct:165, barW:82  },
      { name:"내딸이면_제논",              target:"한한여", cpl7:65149,  cpl3m:44439, ctr:"1.15%", pct:147, barW:73  }
    ],
    caution: [
      { name:"내딸이면_데보라_2",   target:"한한여", cpl7:51330,  cpl3m:44439, ctr:"1.26%", pct:116, barW:58 },
      { name:"능력남 몰리는 이유",   target:"한한남", cpl7:100066, cpl3m:89455, ctr:"2.08%", pct:112, barW:55 }
    ],
    good: [
      { name:"[베리]30대면 아줌마 아니에요",        target:"한한남", cpl7:42299, cpl3m:89455, ctr:"3.36%", pct:47, barW:47, trophy:true },
      { name:"연봉 1억이상_담벼락",                  target:"한한여", cpl7:24349, cpl3m:44439, ctr:"1.52%", pct:55, barW:55, trophy:true },
      { name:"소개팅 거절_평범",                     target:"한일남", cpl7:28106, cpl3m:47122, ctr:"1.64%", pct:60, barW:60 },
      { name:"일본 여자에 환상 가지지 마세요",        target:"한일남", cpl7:30648, cpl3m:47122, ctr:"3.25%", pct:65, barW:65 },
      { name:"4월 2주차_한일 남성_AI_1(1차)",        target:"한일남", cpl7:30803, cpl3m:47122, ctr:"2.41%", pct:65, barW:65 },
      { name:"[베리] 결국 일본 여자를 선택하는 이유", target:"한일남", cpl7:31933, cpl3m:47122, ctr:"2.57%", pct:68, barW:68 },
      { name:"세나_한국남자들은 왜",                  target:"한일남", cpl7:33443, cpl3m:47122, ctr:"3.01%", pct:71, barW:71 },
      { name:"아이츠니_한남_일녀_잘맞는이유는",       target:"한일남", cpl7:41357, cpl3m:47122, ctr:"2.31%", pct:88, barW:88 }
    ]
  }
  // 다음 날 데이터는 스케줄 태스크가 여기에 자동 추가합니다
];

// ============================================================
// CHIP CLASS
// ============================================================
const chipClass = { "한한여":"chip-hhy","한한남":"chip-hhm","한일남":"chip-hjm","한일여":"chip-hjf" };

// ============================================================
// RENDER
// ============================================================
function renderCard(ad, type) {
  const cls = type; // "off" | "caution" | "good"
  const valClass = type === "good" ? "green" : type === "off" ? "red" : "amber";
  const fillClass = type === "good" ? "fill-green" : type === "off" ? "fill-red" : "fill-amber";
  const cpl7Fmt = ad.cpl7.toLocaleString("ko-KR") + "원";
  const cpl3mFmt = ad.cpl3m.toLocaleString("ko-KR") + "원";
  const pctLabel = type === "good" ? `평균 대비 ${ad.pct}% 수준${ad.trophy?" 🏆":""}` : `평균 대비 +${ad.pct-100}%${ad.pct>=220?" 🚨":""}`;
  return `
    <div class="ad-card ${cls}">
      <div class="card-top">
        <div class="ad-name">${ad.name}</div>
        <span class="chip ${chipClass[ad.target]}">${ad.target}</span>
      </div>
      <div class="metrics">
        <div><div class="m-label">7일 CPL</div><div class="m-val ${valClass}">${cpl7Fmt}</div></div>
        <div><div class="m-label">3M 평균 CPL</div><div class="m-val">${cpl3mFmt}</div></div>
        <div><div class="m-label">링크CTR</div><div class="m-val ${valClass}">${ad.ctr}</div></div>
      </div>
      <div class="bar-row">
        <div class="bar-bg"><div class="bar-fill ${fillClass}" style="width:${ad.barW}%"></div></div>
        <span class="bar-label">${pctLabel}</span>
      </div>
    </div>`;
}

function renderTarget(t) {
  const cplDisplay = t.day7CPL ? t.day7CPL.toLocaleString("ko-KR") + "원" : "집행 없음";
  const cplClass = t.trend === "good" ? "green" : t.trend === "up" ? "red" : t.trend === "none" ? "muted" : "";
  const arrow = t.trend === "good" ? " ↓" : t.trend === "up" ? " ↑" : "";
  return `
    <div class="ts-card">
      <div class="ts-name">${t.emoji} ${t.id}</div>
      <div class="ts-row"><span>3M 평균 CPL</span><span class="ts-val">${t.avg3mCPL.toLocaleString("ko-KR")}원</span></div>
      <div class="ts-row"><span>7일 CPL</span><span class="ts-val ${cplClass}">${cplDisplay}${arrow}</span></div>
      <div class="ts-row"><span>7일 상담</span><span class="ts-val">${t.day7Leads}건</span></div>
      <div class="ts-row"><span>3M 평균 CTR</span><span class="ts-val">${t.avg3mCTR}</span></div>
    </div>`;
}

function renderPage(r) {
  return `
<div class="page" id="page-${r.date}">
  <div class="container">
    <div class="page-header">
      <h2>📊 ${r.label} 리포트</h2>
      <span class="subtitle">최근 7일 기준 · 3개월 평균 CPL 대비 분석</span>
    </div>

    <div class="kpi-row">
      <div class="kpi-card c-red">
        <div class="kpi-label">OFF 요망</div>
        <div class="kpi-value">${r.kpi.off}개</div>
        <div class="kpi-sub">CPL 20%↑ + CTR 저조</div>
      </div>
      <div class="kpi-card c-amber">
        <div class="kpi-label">주의</div>
        <div class="kpi-value">${r.kpi.caution}개</div>
        <div class="kpi-sub">CPL 10~20%↑ 또는 CTR 저조</div>
      </div>
      <div class="kpi-card c-green">
        <div class="kpi-label">GOOD</div>
        <div class="kpi-value">${r.kpi.good}개</div>
        <div class="kpi-sub">3M 평균 CPL 하회</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">총 광고비 (7일)</div>
        <div class="kpi-value">${r.kpi.totalSpend}</div>
        <div class="kpi-sub">총 상담 ${r.kpi.totalLeads}건</div>
      </div>
    </div>

    <div class="target-row">
      ${r.targets.map(renderTarget).join("")}
    </div>

    <div class="divider"></div>

    <div class="section">
      <div class="section-hd">
        <span class="section-title">🔴 소재 OFF 요망</span>
        <span class="badge b-red">CPL 3M 평균 20%↑ + 링크CTR 저조</span>
      </div>
      <div class="cards">${r.off.map(a => renderCard(a,"off")).join("")}</div>
    </div>

    <div class="section">
      <div class="section-hd">
        <span class="section-title">🟡 주의 소재</span>
        <span class="badge b-amber">CPL 10~20%↑ 또는 CTR 저조</span>
      </div>
      <div class="cards">${r.caution.map(a => renderCard(a,"caution")).join("")}</div>
    </div>

    <div class="divider"></div>

    <div class="section">
      <div class="section-hd">
        <span class="section-title">🟢 소재 GOOD</span>
        <span class="badge b-green">3M 평균 CPL 하회 · 유지 권장</span>
      </div>
      <div class="cards">${r.good.map(a => renderCard(a,"good")).join("")}</div>
    </div>
  </div>
</div>`;
}

// Build pages
const pagesEl = document.getElementById("pages");
const tabsEl = document.getElementById("dateTabs");

// newest first
const sorted = [...REPORTS].sort((a,b) => b.date.localeCompare(a.date));

sorted.forEach((r, i) => {
  pagesEl.innerHTML += renderPage(r);
  const btn = document.createElement("button");
  btn.className = "date-tab" + (i===0?" active":"");
  btn.textContent = r.label;
  btn.dataset.date = r.date;
  btn.onclick = () => switchTo(r.date);
  tabsEl.appendChild(btn);
});

// activate first
if (sorted.length > 0) {
  document.getElementById("page-" + sorted[0].date).classList.add("active");
}

function switchTo(date) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".date-tab").forEach(t => t.classList.remove("active"));
  document.getElementById("page-"+date).classList.add("active");
  document.querySelector(`[data-date="${date}"]`).classList.add("active");
  window.scrollTo({top:0, behavior:"smooth"});
}
</script>
</body>
</html>
