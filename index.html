<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twennies 메타 광고 리포트</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --card2: #22263a;
    --border: #2e3350;
    --text: #e8eaf6;
    --muted: #8b90b8;
    --off: #ff4d6d;
    --caution: #ffd166;
    --good: #06d6a0;
    --blue: #4cc9f0;
    --purple: #b5179e;
    --accent: #7209b7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif; min-height: 100vh; }

  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 18px; font-weight: 700; color: var(--text); }
  header .subtitle { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .reload-btn { background: var(--card2); border: 1px solid var(--border); color: var(--muted); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .reload-btn:hover { color: var(--text); }

  .date-tabs { display: flex; gap: 8px; padding: 16px 24px 0; overflow-x: auto; }
  .date-tab { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--muted); cursor: pointer; font-size: 13px; white-space: nowrap; }
  .date-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  main { padding: 20px 24px; max-width: 1200px; margin: 0 auto; }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .kpi-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .kpi-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .kpi-value { font-size: 28px; font-weight: 700; }
  .kpi-card.off .kpi-value { color: var(--off); }
  .kpi-card.caution .kpi-value { color: var(--caution); }
  .kpi-card.good .kpi-value { color: var(--good); }
  .kpi-card.spend .kpi-value { color: var(--blue); }
  .kpi-card.leads .kpi-value { color: var(--text); }

  .section-title { font-size: 14px; font-weight: 600; color: var(--muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }

  .targets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .target-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .target-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .target-name { font-size: 15px; font-weight: 700; }
  .target-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; }
  .target-row .label { color: var(--muted); }
  .target-row .val { font-weight: 600; }
  .trend-up { color: var(--off); }
  .trend-down { color: var(--caution); }
  .trend-good { color: var(--good); }
  .trend-none { color: var(--muted); }

  .ads-section { margin-bottom: 24px; }
  .ads-section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding: 10px 16px; border-radius: 8px; }
  .ads-section-header.off-header { background: rgba(255,77,109,0.1); border: 1px solid rgba(255,77,109,0.3); }
  .ads-section-header.caution-header { background: rgba(255,209,102,0.1); border: 1px solid rgba(255,209,102,0.3); }
  .ads-section-header.good-header { background: rgba(6,214,160,0.1); border: 1px solid rgba(6,214,160,0.3); }
  .ads-section-title { font-size: 14px; font-weight: 700; }
  .ads-section-count { font-size: 12px; color: var(--muted); }

  .ad-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 8px; }
  .ad-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .ad-name { font-size: 13px; font-weight: 600; flex: 1; padding-right: 12px; line-height: 1.4; }
  .ad-target-badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; background: var(--card2); color: var(--muted); white-space: nowrap; }
  .ad-metrics { display: flex; gap: 20px; font-size: 12px; margin-bottom: 8px; }
  .ad-metric .label { color: var(--muted); margin-bottom: 2px; }
  .ad-metric .val { font-weight: 700; font-size: 14px; }
  .ad-metric.bad .val { color: var(--off); }
  .ad-metric.good-val .val { color: var(--good); }
  .ad-metric.avg .val { color: var(--muted); }
  .bar-wrapper { background: var(--card2); border-radius: 4px; height: 6px; overflow: hidden; }
  .bar { height: 100%; border-radius: 4px; transition: width 0.3s; }
  .bar.off-bar { background: var(--off); }
  .bar.caution-bar { background: var(--caution); }
  .bar.good-bar { background: var(--good); }
  .pct-label { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; justify-content: space-between; }
  .trophy { font-size: 14px; margin-left: 6px; }
</style>
</head>

let currentIdx = 0;

function fmt(n) {
  if (n === null || n === undefined) return '—';
  return n.toLocaleString('ko-KR') + '원';
}

function trendIcon(trend) {
  if (trend === 'up') return '<span class="trend-up">▲ 상승</span>';
  if (trend === 'down') return '<span class="trend-down">▼ 하락</span>';
  if (trend === 'good') return '<span class="trend-good">✓ 양호</span>';
  return '<span class="trend-none">— 데이터 없음</span>';
}

function renderReport(report) {
  const kpi = report.kpi;
  let html = `
    <div class="kpi-grid">
      <div class="kpi-card off"><div class="kpi-label">🔴 OFF 소재</div><div class="kpi-value">${kpi.off}</div></div>
      <div class="kpi-card caution"><div class="kpi-label">🟡 주의 소재</div><div class="kpi-value">${kpi.caution}</div></div>
      <div class="kpi-card good"><div class="kpi-label">🟢 GOOD 소재</div><div class="kpi-value">${kpi.good}</div></div>
      <div class="kpi-card spend"><div class="kpi-label">💰 7일 총 광고비</div><div class="kpi-value">${kpi.totalSpend}</div></div>
      <div class="kpi-card leads"><div class="kpi-label">📋 7일 총 상담수</div><div class="kpi-value">${kpi.totalLeads}</div></div>
    </div>

    <div class="section-title">타겟별 성과</div>
    <div class="targets-grid">
  `;

  for (const t of report.targets) {
    html += `
      <div class="target-card">
        <div class="target-header">
          <span>${t.emoji}</span>
          <span class="target-name">${t.id}</span>
        </div>
        <div class="target-row"><span class="label">7일 상담수</span><span class="val">${t.day7Leads}건</span></div>
        <div class="target-row"><span class="label">7일 CPL</span><span class="val">${fmt(t.day7CPL)}</span></div>
        <div class="target-row"><span class="label">3M 평균 CPL</span><span class="val">${fmt(t.avg3mCPL)}</span></div>
        <div class="target-row"><span class="label">3M 평균 CTR</span><span class="val">${t.avg3mCTR}</span></div>
        <div class="target-row"><span class="label">추세</span><span class="val">${trendIcon(t.trend)}</span></div>
      </div>
    `;
  }

  html += `</div>`;

  function renderAdList(list, colorClass, barClass, label, labelColor) {
    if (!list.length) return '';
    let s = `
      <div class="ads-section">
        <div class="ads-section-header ${colorClass}-header">
          <span class="ads-section-title" style="color:var(--${colorClass})">${label}</span>
          <span class="ads-section-count">${list.length}개 소재</span>
        </div>
    `;
    for (const ad of list) {
      const pctLabel = colorClass === 'good'
        ? `3M 평균의 ${ad.pct}% (${100 - ad.pct}% 절감)`
        : `3M 평균 대비 ${ad.pct}%`;
      s += `
        <div class="ad-card">
          <div class="ad-top">
            <div class="ad-name">${ad.name}${ad.trophy ? '<span class="trophy">🏆</span>' : ''}</div>
            <div class="ad-target-badge">${ad.target}</div>
          </div>
          <div class="ad-metrics">
            <div class="ad-metric ${colorClass === 'good' ? 'good-val' : 'bad'}">
              <div class="label">7일 CPL</div>
              <div class="val">${fmt(ad.cpl7)}</div>
            </div>
            <div class="ad-metric avg">
              <div class="label">3M 평균 CPL</div>
              <div class="val">${fmt(ad.cpl3m)}</div>
            </div>
            <div class="ad-metric">
              <div class="label">링크 CTR</div>
              <div class="val">${ad.ctr}</div>
            </div>
          </div>
          <div class="bar-wrapper"><div class="bar ${barClass}" style="width:${ad.barW}%"></div></div>
          <div class="pct-label"><span>${pctLabel}</span></div>
        </div>
      `;
    }
    s += `</div>`;
    return s;
  }

  html += renderAdList(report.off, 'off', 'off-bar', '🔴 OFF 요망 소재', 'off');
  html += renderAdList(report.caution, 'caution', 'caution-bar', '🟡 주의 소재', 'caution');
  html += renderAdList(report.good, 'good', 'good-bar', '🟢 GOOD 소재', 'good');

  if (report.unclassified && report.unclassified.length > 0) {
    html += `<div style="margin-top:16px;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:10px;font-size:12px;color:var(--muted)">
      ⚠️ 분류 안 된 캠페인: ${report.unclassified.join(', ')}
    </div>`;
  }

  document.getElementById('mainContent').innerHTML = html;
}

function init() {
  const tabs = document.getElementById('dateTabs');
  REPORTS.forEach((r, i) => {
    const btn = document.createElement('button');
    btn.className = 'date-tab' + (i === 0 ? ' active' : '');
    btn.textContent = r.label;
    btn.onclick = () => {
      document.querySelectorAll('.date-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentIdx = i;
      renderReport(REPORTS[i]);
    };
    tabs.appendChild(btn);
  });
  renderReport(REPORTS[0]);
}

init();
</script>
