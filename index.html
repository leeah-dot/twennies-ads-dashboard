<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twennies 메타 광고 리포트</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
    background: #f5f5f7; color: #1a1a1a; min-height: 100vh;
    padding-left: 250px;
  }

  /* === TOP NAV === */
  .topnav {
    position: sticky; top: 0; z-index: 200;
    background: rgba(245,245,247,0.95);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid #e0e0e0;
    padding: 0 24px;
  }
  .topnav-inner {
    max-width: 1180px; margin: 0 auto;
    display: flex; align-items: center; gap: 0; height: 56px;
  }
  .date-tabs {
    display: flex; gap: 2px; overflow-x: auto; flex: 1 1 0%; min-width: 0;
    scrollbar-width: thin; padding-bottom: 3px;
  }
  .date-tabs::-webkit-scrollbar { height: 6px; }
  .date-tabs::-webkit-scrollbar-thumb { background: #c8c8c8; border-radius: 3px; }
  .date-tabs::-webkit-scrollbar-track { background: transparent; }
  .date-tab {
    font-size: 12px; font-weight: 600;
    padding: 6px 14px; border-radius: 8px;
    cursor: pointer; white-space: nowrap;
    border: none; background: transparent; color: #666;
    transition: all .15s;
  }
  .date-tab:hover { background: #e8e8e8; color: #1a1a1a; }
  .date-tab.active { background: #1a1a1a; color: #fff; }
  .date-tab.weekly { color: #0e7490; font-weight: 700; }
  .date-tab.weekly.active { background: #0e7490; color: #fff; }

  /* Twennies Logo */
  .twennies-logo {
    display: flex; align-items: center; margin-left: 16px; flex-shrink: 0;
  }

  /* === GLOSSARY SIDEBAR === */
  .glossary {
    position: fixed; left: 0; top: 0; width: 250px; height: 100vh;
    background: #fff; border-right: 1px solid #e5e5e5;
    padding: 18px 18px 40px; overflow-y: auto; z-index: 210;
  }
  .side-section { margin-bottom: 22px; }
  .glossary h3 { font-size: 15px; font-weight: 800; color:#1a1a1a; margin-bottom: 8px; }
  .glossary .gsub { font-size: 10px; color:#bbb; margin-bottom: 14px; letter-spacing:.4px; }
  .glossary .gitem { margin-bottom: 13px; padding-bottom: 13px; border-bottom: 1px solid #f0f0f0; }
  .glossary .gterm { font-size: 14px; font-weight: 800; color:#0e7490; }
  .glossary .gdef { font-size: 12.5px; color:#555; line-height:1.6; margin-top:4px; }
  .glossary .gdef b { color:#1a1a1a; }
  /* 주간 탭 세로 리스트 */
  .weekly-list { display:flex; flex-direction:column; gap:5px; }
  .weekly-list .date-tab { width:100%; text-align:left; padding:9px 12px; font-size:12.5px; border-radius:8px; }
  .kpi-delta { font-size: 11px; margin-top: 7px; font-weight: 700; color:#999; line-height:1.4; }
  .kpi-delta.bad { color:#e03e3e; }
  .kpi-delta.good { color:#0a8f3c; }
  @media (max-width: 900px) {
    body { padding-left: 0 !important; }
    .glossary { display: none; }
  }

  /* === MAIN === */
  .page { display: none; padding: 28px 24px 64px; }
  .page.active { display: block; }
  .container { max-width: 1180px; margin: 0 auto; }

  /* === PAGE HEADER === */
  .page-header {
    display: flex; align-items: baseline; gap: 12px;
    margin-bottom: 20px; flex-wrap: wrap;
  }
  .page-header h2 { font-size: 20px; font-weight: 800; }
  .page-header .subtitle { font-size: 12px; color: #888; }

  /* === WEEKLY CPL TABLE === */
  .weekly-section { margin-bottom: 28px; }
  .weekly-section .sec-title {
    font-size: 13px; font-weight: 800; color: #1a1a1a;
    margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
  }
  .weekly-scroll { overflow-x: auto; }
  .weekly-table {
    border-collapse: collapse; font-size: 11px;
    min-width: 560px; width: 100%;
    background: #fff; border-radius: 12px; overflow: hidden;
    border: 1px solid #e5e5e5;
  }
  .weekly-table th {
    background: #f8f8f8; padding: 8px 12px;
    font-weight: 700; text-align: center; color: #555;
    border-bottom: 1px solid #e5e5e5;
    white-space: nowrap;
  }
  .weekly-table th.week-col { text-align: left; min-width: 90px; }
  .weekly-table td {
    padding: 7px 12px; text-align: center;
    border-bottom: 1px solid #f0f0f0; white-space: nowrap;
  }
  .weekly-table td.week-label {
    text-align: left; font-weight: 600; color: #666; font-size: 10px;
  }
  .weekly-table tr:last-child td { border-bottom: none; }
  .weekly-table tr:hover td { background: #fafafa; }
  .cpl-cell { font-weight: 700; font-size: 11px; }
  .cpl-vhigh { color: #c81e1e; font-weight: 800; }  /* 🔴 매우 나쁨 +20%↑ */
  .cpl-high { color: #e8850c; }                      /* 🟠 나쁨 +10~20% */
  .cpl-mid { color: #6b7280; }                       /* ⚪ 보통 ±10% */
  .cpl-low { color: #2563eb; }                       /* 🔵 좋음 -10~-20% */
  .cpl-vlow { color: #0a8f3c; font-weight: 800; }    /* 🟢 매우 좋음 -20%↓ */
  .cpl-none { color: #ccc; }
  .avg-row td { background: #f8f8f8; font-size: 10px; color: #888; font-style: italic; }
  .avg-row td.week-label { font-weight: 700; color: #555; font-style: normal; }

  /* === KPI ROW === */
  .kpi-row {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 10px; margin-bottom: 20px;
  }
  .kpi-card {
    background: #fff; border-radius: 12px;
    padding: 16px 18px; border: 1px solid #e5e5e5;
  }
  .kpi-label { font-size: 10px; color: #999; margin-bottom: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
  .kpi-value { font-size: 24px; font-weight: 800; }
  .kpi-sub { font-size: 10px; color: #bbb; margin-top: 3px; }
  .kpi-card.c-red .kpi-value { color: #e03e3e; }
  .kpi-card.c-green .kpi-value { color: #1a9e5f; }
  .kpi-card.c-amber .kpi-value { color: #d97706; }

  /* === TARGET SUMMARY === */
  .target-row {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 10px; margin-bottom: 24px;
  }
  .ts-card {
    background: #fff; border-radius: 12px;
    padding: 14px 16px; border: 1px solid #e5e5e5;
  }
  .ts-name { font-size: 12px; font-weight: 700; margin-bottom: 8px; }
  .ts-row { display: flex; justify-content: space-between; font-size: 11px; color: #999; margin-bottom: 4px; }
  .ts-val { font-weight: 700; color: #1a1a1a; }
  .ts-val.red { color: #e03e3e; }
  .ts-val.green { color: #1a9e5f; }
  .ts-val.muted { color: #bbb; }
  .ts-divider { height: 1px; background: #f0f0f0; margin: 7px 0; }

  /* === CAMPAIGN TABLE === */
  .camp-section { margin-bottom: 28px; }
  .camp-table {
    border-collapse: collapse; font-size: 11px; width: 100%;
    background: #fff; border-radius: 12px; overflow: hidden;
    border: 1px solid #e5e5e5;
  }
  .camp-table th {
    background: #f8f8f8; padding: 8px 14px;
    font-weight: 700; text-align: left; color: #555;
    border-bottom: 1px solid #e5e5e5;
  }
  .camp-table th:not(:first-child) { text-align: right; }
  .camp-table td {
    padding: 8px 14px; border-bottom: 1px solid #f0f0f0;
    vertical-align: middle;
  }
  .camp-table td:not(:first-child) { text-align: right; font-weight: 600; }
  .camp-table tr:last-child td { border-bottom: none; }
  .camp-table tr:hover td { background: #fafafa; }
  .camp-name { font-weight: 600; color: #1a1a1a; }
  .camp-tag {
    display: inline-block; font-size: 9px; font-weight: 700;
    padding: 2px 6px; border-radius: 4px; margin-right: 6px;
    vertical-align: middle;
  }

  /* === SECTION === */
  .section { margin-bottom: 28px; }
  .section-hd { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .section-title { font-size: 14px; font-weight: 800; }
  .badge { font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 99px; }
  .b-red { background: #fde8e8; color: #c0392b; }
  .b-green { background: #e0f5ec; color: #1a7f4b; }
  .b-amber { background: #fef3c7; color: #92400e; }

  /* === AD CARDS === */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 10px; }
  .ad-card {
    background: #fff; border-radius: 12px;
    padding: 16px 18px; border: 1px solid #e5e5e5; border-left-width: 4px;
  }
  .ad-card.off { border-left-color: #e03e3e; }
  .ad-card.caution { border-left-color: #f59e0b; }
  .ad-card.good { border-left-color: #1a9e5f; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .ad-name { font-size: 12px; font-weight: 700; line-height: 1.45; flex: 1; padding-right: 8px; }
  .chip { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 5px; white-space: nowrap; flex-shrink: 0; }
  .chip-hhy { background: #ede9fe; color: #5b21b6; }
  .chip-hhm { background: #dbeafe; color: #1e40af; }
  .chip-hjm { background: #fce7f3; color: #9d174d; }
  .chip-hjf { background: #d1fae5; color: #065f46; }
  .metrics { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 10px; }
  .m-label { font-size: 9px; color: #bbb; margin-bottom: 1px; font-weight: 500; }
  .m-val { font-size: 13px; font-weight: 700; }
  .m-val.red { color: #e03e3e; }
  .m-val.green { color: #1a9e5f; }
  .m-val.amber { color: #d97706; }
  .bar-row { display: flex; align-items: center; gap: 8px; }
  .bar-bg { flex: 1; height: 4px; background: #f0f0f0; border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 99px; }
  .fill-red { background: #e03e3e; }
  .fill-amber { background: #f59e0b; }
  .fill-green { background: #1a9e5f; }
  .bar-label { font-size: 10px; color: #999; font-weight: 600; white-space: nowrap; }

  .divider { height: 1px; background: #ebebeb; margin: 20px 0 24px; }

  @media (max-width: 700px) {
    .kpi-row, .target-row { grid-template-columns: repeat(2, 1fr); }
    .cards { grid-template-columns: 1fr; }
  }
</style>
</head>

const chipClass = { "한한여":"chip-hhy","한한남":"chip-hhm","한일남":"chip-hjm","한일여":"chip-hjf" };

  "한한여": "background:#ede9fe;color:#5b21b6",
  "한한남": "background:#dbeafe;color:#1e40af",

// ============================================================
// WEEKLY CPL TABLE
// ============================================================
function fmtCPL(v) {
  if (v == null) return '<span class="cpl-none">—</span>';
  const s = Math.round(v/10000*10)/10;
  return (s % 1 === 0 ? s.toFixed(0) : s.toFixed(1)) + '만';
}

// 평균 대비 5단계 판정: ≤-20% 매우좋음 / -20~-10% 좋음 / ±10% 보통 / +10~20% 나쁨 / ≥+20% 매우나쁨
function gradeClass(v, avg) {
  if (v == null || !avg) return 'cpl-none';
  const r = v / avg;
  if (r <= 0.8) return 'cpl-vlow';
  if (r <= 0.9) return 'cpl-low';
  if (r < 1.1)  return 'cpl-mid';
  if (r < 1.2)  return 'cpl-high';
  return 'cpl-vhigh';
}
function gradeLabel(v, avg) {
  if (v == null || !avg) return '—';
  const r = v / avg;
  if (r <= 0.8) return '🟢 매우 좋음';
  if (r <= 0.9) return '🔵 좋음';
  if (r < 1.1)  return '⚪ 보통';
  if (r < 1.2)  return '🟠 나쁨';
  return '🔴 매우 나쁨';
}
function cplClass(v, target) {
  if (v == null) return 'cpl-none';
  const avg = AVG_3M[target];
  if (!avg) return 'cpl-cell';
  return 'cpl-cell ' + gradeClass(v, avg);
}
function cpsClass(v, target) {
  if (v == null) return 'cpl-none';
  return 'cpl-cell ' + gradeClass(v, AVG_3M_CPS[target]);
}

function renderWeeklyTable() {
  const targets = ['한한여','한한남','한일남','한일여'];
  const emojis  = { '한한여':'🟣','한한남':'🔵','한일남':'🩷','한일여':'🟢' };
  let html = `
  <div class="weekly-section">
    <div class="sec-title">📅 주차별 평균 CPL <span style="font-size:10px;font-weight:400;color:#aaa;margin-left:4px">월~일 기준 · 4/6~7/5 · 결과 기준 · 3M 평균 = 4/6~7/5</span></div>
    <div class="weekly-scroll">
    <table class="weekly-table">
      <thead><tr>
        <th class="week-col">주차</th>
        ${targets.map(t => `<th>${emojis[t]} ${t}</th>`).join('')}
      </tr></thead>
      <tbody>`;

  for (const row of WEEKLY_CPL) {
    html += `<tr><td class="week-label">${row.week}</td>`;
    for (const t of targets) {
      const v = row[t];
      html += `<td class="${cplClass(v,t)}">${fmtCPL(v)}</td>`;
    }
    html += `</tr>`;
  }

  // 3M avg row
  html += `<tr class="avg-row"><td class="week-label">3M 평균</td>`;
  for (const t of targets) {
    const avg = AVG_3M[t];
    html += `<td class="cpl-cell">${avg ? fmtCPL(avg) : '—'}</td>`;
  }
  html += `</tr></tbody></table></div></div>`;
  return html;
}

// ============================================================
// CAMPAIGN TABLE
// ============================================================
function renderCampaignTable(campaigns) {
  if (!campaigns || !campaigns.length) return '';
  const rows = campaigns.map(c => `
    <tr>
      <td class="camp-name">
        <span class="camp-tag" style="${campTagStyle[c.target]}">${c.target}</span>${c.name}
      </td>
      <td>${c.adCount}개</td>
      <td>${c.spend7d}</td>
      <td>${c.leads7d}건</td>
    </tr>`).join('');
  return `
  <div class="camp-section">
    <div class="section-hd">
      <span class="section-title">📋 캠페인별 현황 (7일)</span>
    </div>
    <table class="camp-table">
      <thead><tr>
        <th>캠페인</th>
        <th style="text-align:right">소재수</th>
        <th style="text-align:right">광고비</th>
        <th style="text-align:right">결과</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function renderTarget(t) {

function renderCard(ad, type) {
  const valClass = type === "good" ? "green" : type === "off" ? "red" : "amber";
  const fillClass = type === "good" ? "fill-green" : type === "off" ? "fill-red" : "fill-amber";
  const cpl7Fmt  = ad.cpl7.toLocaleString("ko-KR") + "원";
  const cpl3mFmt = ad.cpl3m.toLocaleString("ko-KR") + "원";
  const pctLabel = type === "good"
    ? `평균 대비 ${ad.pct}% 수준${ad.trophy?" 🏆":""}`
    : `평균 대비 ${ad.pct>=100?"+":""}${ad.pct-100}%${ad.pct>=220?" 🚨":""}`;
  return `
    <div class="ad-card ${type}">
      <div class="card-top">
        <div class="ad-name">${ad.name}</div>
        <span class="chip ${chipClass[ad.target]}">${ad.target}</span>
      </div>
      <div class="metrics">
        <div><div class="m-label">7일 CPL</div><div class="m-val ${valClass}">${cpl7Fmt}</div></div>
        <div><div class="m-label">3M 평균 CPL</div><div class="m-val">${cpl3mFmt}</div></div>
        <div><div class="m-label">링크CTR</div><div class="m-val ${valClass}">${ad.ctr}</div></div>
      </div>
      ${ad.cps7 !== undefined ? `<div style="font-size:11px;color:#666;margin:2px 0 6px">통과 ${ad.pass7 != null ? ad.pass7 : 0}건 · 통과CPS ${ad.cps7 ? ad.cps7.toLocaleString("ko-KR") + "원" : "—"}${ad.cps3m ? " (3M " + ad.cps3m.toLocaleString("ko-KR") + "원)" : ""}</div>` : ""}
      <div class="bar-row">
        <div class="bar-bg"><div class="bar-fill ${fillClass}" style="width:${ad.barW}%"></div></div>
        <span class="bar-label">${pctLabel}</span>
      </div>
    </div>`;
}

function renderDaily(r) {
  if (!r.daily || !r.daily.targets || !r.daily.targets.length) return '';
  const avgOf = {};
  (r.targets || []).forEach(t => { avgOf[t.id] = t.avg3mCPL; });
  const rows = r.daily.targets.map(t => {
    const avg = avgOf[t.id];
    let cplHtml;
    if (t.cpl == null) {
      cplHtml = '<span style="color:#ccc">—</span>';
    } else {
      let cls = '';
      if (avg) cls = t.cpl > avg * 1.2 ? 'cpl-high' : (t.cpl < avg * 0.9 ? 'cpl-low' : 'cpl-mid');
      cplHtml = `<span class="${cls}" style="font-weight:700">${t.cpl.toLocaleString("ko-KR")}원</span>`;
    }
    return `
    <tr>
      <td class="camp-name">${t.emoji} ${t.id}</td>
      <td>${t.spend}</td>
      <td>${t.impressions.toLocaleString("ko-KR")}</td>
      <td>${t.clicks.toLocaleString("ko-KR")}</td>
      <td>${t.leads}건</td>
      <td>${cplHtml}</td>
      <td>${t.ctr}</td>
    </tr>`;
  }).join('');
  return `
  <div class="camp-section">
    <div class="section-hd">
      <span class="section-title">📆 ${r.daily.label} 하루 성과</span>
      <span class="badge" style="background:#eef2ff;color:#3730a3">1일 기준 · 전일 데이터</span>
    </div>
    <table class="camp-table">
      <thead><tr>
        <th>타겟</th>
        <th style="text-align:right">광고비</th>
        <th style="text-align:right">노출</th>
        <th style="text-align:right">링크클릭</th>
        <th style="text-align:right">결과</th>
        <th style="text-align:right">CPL</th>
        <th style="text-align:right">링크CTR</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

// ============================================================
// DAILY RESULTS TREND CHART (14일)
// ============================================================
function renderTrend(r) {
  if (!r.dailyTrend || !r.dailyTrend.length) return '';
  const days = r.dailyTrend;
  const W = 1120, H = 270, padL = 20, padR = 20, padT = 44, padB = 34;
  const cw = (W - padL - padR) / days.length;
  const maxRes = Math.max(...days.map(d => d.results), 1);
  const allCpl = days.flatMap(d => [d.cplTotal, d.cplAd].filter(v => v != null));
  const maxCpl = Math.max(...allCpl, 1);
  let bars = '', labels = '';
  const ptsT = [], ptsA = [];
  days.forEach((d, i) => {
    const x = padL + cw * i + cw * 0.5;
    const bh = (H - padT - padB) * d.results / maxRes;
    const bw = Math.min(cw * 0.5, 34);
    bars += `<rect x="${x - bw/2}" y="${H - padB - bh}" width="${bw}" height="${Math.max(bh,1)}" rx="3" fill="#6EC8D8" opacity="0.75"/>`;
    bars += `<text x="${x}" y="${H - padB - bh - 5}" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">${d.results}</text>`;
    labels += `<text x="${x}" y="${H - padB + 15}" text-anchor="middle" font-size="9" fill="#999">${d.d}</text>`;
    if (d.cplTotal != null) ptsT.push([x, padT + (H - padT - padB) * (1 - d.cplTotal / maxCpl), d.cplTotal]);
    if (d.cplAd != null)    ptsA.push([x, padT + (H - padT - padB) * (1 - d.cplAd / maxCpl), d.cplAd]);
  });
  const line = (pts, color) => `<polyline points="${pts.map(p => p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${color}" stroke-width="2" opacity="0.8"/>`;
  const dots = (pts, color) => pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="${color}"><title>${p[2].toLocaleString("ko-KR")}원</title></circle>`).join('');
  return `
  <div class="camp-section">
    <div class="section-hd">
      <span class="section-title">📈 일별 결과 추이 (최근 ${days.length}일)</span>
      <span class="badge" style="background:#e0f2f7;color:#0e7490">막대: 일 리드수 · <b style="color:#e03e3e">빨강=총 CPL</b> · <b style="color:#2563eb">파랑=광고 CPL</b></span>
    </div>
    <div style="background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:14px 10px;overflow-x:auto">
      <svg viewBox="0 0 ${W} ${H}" style="min-width:680px;width:100%;display:block" xmlns="http://www.w3.org/2000/svg">
        ${bars}
        ${line(ptsT,"#e03e3e")}${dots(ptsT,"#e03e3e")}
        ${line(ptsA,"#2563eb")}${dots(ptsA,"#2563eb")}
        ${labels}
        <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#e5e5e5"/>
      </svg>
    </div>
    <div style="font-size:10px;color:#999;margin-top:6px">· 총 CPL = 광고비 ÷ 전체 리드(모든 유입) · 광고 CPL = 광고비 ÷ 광고 태깅 리드</div>
  </div>`;
}

function renderWeeklyCps() {
  if (typeof WEEKLY_CPS === 'undefined' || !WEEKLY_CPS.length) return '';
  const targets = ['한한여','한한남','한일남','한일여'];
  const emojis = { '한한여':'🟣','한한남':'🔵','한일남':'🩷','한일여':'🟢' };
  let html = `
  <div class="camp-section">
    <div class="section-hd">
      <span class="section-title">📊 주차별 평균 CPS (통과당 비용)</span>

    </div>
    <div class="weekly-scroll">
    <table class="weekly-table">
      <thead><tr><th class="week-col">주차</th>${targets.map(t=>`<th>${emojis[t]} ${t}</th>`).join('')}</tr></thead>
      <tbody>`;
  for (const row of WEEKLY_CPS) {
    html += `<tr><td class="week-label">${row.week}</td>`;
    for (const t of targets) {
      const v = row[t];
      html += `<td class="cpl-cell">${v ? (Math.round(v/1000)/10) + '만' : '—'}</td>`;
    }
    html += `</tr>`;
  }
  html += `</tbody></table></div></div>`;
  return html;
}

function renderMonthlyPage(m) {
  const o = m.overview;
  const segRows = m.segments.map(s => `
    <tr>
      <td class="camp-name">${s.emoji} ${s.name}</td>
      <td>${s.spend}</td><td>${s.share}</td>
      <td>${s.leads}건</td><td>${s.pass}${typeof s.pass === "number" ? "건" : ""}</td>
      <td style="font-weight:700">${s.passRate}</td>
      <td style="font-weight:700">${s.cpl}</td><td style="font-weight:700">${s.cps}</td>
      <td style="text-align:left;font-size:11px">${s.note}</td>
    </tr>`).join("");
  const crRows = m.creatives.map(c => `
    <tr>
      <td class="camp-name">${c.grade} <span class="camp-tag" style="${campTagStyle[c.target]}">${c.target}</span>${c.name}</td>
      <td>${c.spend}</td><td>${c.leads}건</td><td>${c.pass}건</td>
      <td style="font-weight:700">${c.passRate||"—"}</td>
      <td class="${c.cls}" style="font-weight:700">${c.cpl}</td>
      <td class="${c.cls}" style="font-weight:700">${c.cps}</td>
    </tr>`).join("");
  return `
<div class="page" id="page-${m.id}">
  <div class="container">
    <div class="page-header">
      <h2>🗓️ ${m.title}</h2>
      <span class="subtitle">메타 + 네이버 통합 · 리드/통과 = 어드민 API</span>
    </div>

    <div class="kpi-row" style="flex-wrap:wrap">
      <div class="kpi-card"><div class="kpi-label">총 광고비</div><div class="kpi-value">${o.spend}</div><div class="kpi-sub">${o.spendSub}</div></div>
      <div class="kpi-card"><div class="kpi-label">매출 / ROAS</div><div class="kpi-value">${o.roas}</div><div class="kpi-sub">매출 ${o.rev} · ${o.roasSub}</div></div>
      <div class="kpi-card"><div class="kpi-label">리드 / 통과</div><div class="kpi-value">${o.leads}건</div><div class="kpi-sub">통과 ${o.pass}건 (${o.passRate})</div></div>
      <div class="kpi-card"><div class="kpi-label">평균 CPL</div><div class="kpi-value">${o.cpl}</div><div class="kpi-sub">리드당</div></div>
      <div class="kpi-card"><div class="kpi-label">평균 CPS</div><div class="kpi-value">${o.cps}</div><div class="kpi-sub">통과당</div></div>
      <div class="kpi-card"><div class="kpi-label">평균 CTR</div><div class="kpi-value">${o.ctr}</div><div class="kpi-sub">1차상담 ${o.consult}건 · 결제 ${o.paid}건</div></div>
    </div>

    <div class="camp-section">
      <div class="section-hd"><span class="section-title">🧭 6월 총평 (CEO 보고용)</span><span class="badge" style="background:#f0fdf4;color:#166534">핵심 5줄</span></div>
      <div style="background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:16px 18px">
        <ol style="margin:0;padding-left:18px;font-size:13px;line-height:1.95;color:#1a1a1a">
          ${m.analysis.map(t => `<li style="margin-bottom:8px">${t}</li>`).join("")}
        </ol>
      </div>
    </div>

    <div class="camp-section">
      <div class="section-hd"><span class="section-title">🎯 타겟별 성과</span></div>
      <div class="weekly-scroll">
      <table class="camp-table" style="min-width:900px">
        <thead><tr>
          <th>타겟</th><th style="text-align:right">광고비</th><th style="text-align:right">비중</th>
          <th style="text-align:right">리드</th><th style="text-align:right">통과</th><th style="text-align:right">통과율</th>

    { grade:"⚠️", cls:"b-amber", text:"남성 : 광고비 10% 증가했으나 CPL 상승 — 한한 남성 메타 CVR 급락(광고비 3배 증가, CVR 1.1%)이 주요 원인" }
  ],
  deepTitle: "한일 여성 심층 비교 — 6/1~6/7 vs 6/29~7/5",
  deepCols: ["6/1~6/7", "6/29~7/5", "변화"],
  deep: [
    { item:"총 광고비",      a:"1,287,293원", b:"673,094원",  chg:"▼ -47.7%",       dir:"" },
    { item:"서경인 광고비",  a:"323,745원",   b:"313,601원",  chg:"▼ -3.1%",        dir:"" },
    { item:"일본 광고비",    a:"963,548원",   b:"359,493원",  chg:"▼ -62.7%",       dir:"" },
    { item:"총 링크 클릭",   a:"578",         b:"307",        chg:"▼ -46.9%",       dir:"" },
    { item:"서경인 CTR",     a:"0.59%",       b:"0.82%",      chg:"▲ +0.23%p",      dir:"good" },
    { item:"일본 CTR",       a:"1.73%",       b:"2.37%",      chg:"▲ +0.64%p",      dir:"good" },
    { item:"서경인 리드",    a:"—",           b:"1건",        chg:"—",              dir:"" },
    { item:"일본 리드",      a:"9건",         b:"14건",       chg:"▲ +5건",         dir:"good" },
    { item:"총 리드",        a:"9건",         b:"15건",       chg:"▲ +6건",         dir:"good" },
    { item:"일본 CPL",       a:"107,061원",   b:"25,678원",   chg:"개선 -76.0%",    dir:"good" },
    { item:"전체 CPL",       a:"143,033원",   b:"44,873원",   chg:"개선 -68.6%",    dir:"good" }
  ]
}
];

function renderWeeklyPage(w) {
  const dirCls = d => d === "good" ? "cpl-low" : d === "bad" ? "cpl-high" : "";
  const groupRows = w.groups.map(g => `
    <tr>
      <td class="camp-name">${g.grade} ${g.name}</td>
      <td>${g.spendPrev}</td><td>${g.spendCur}</td><td>${g.spendChg}</td>
      <td>${g.cplPrev}</td><td style="font-weight:700">${g.cplCur}</td>
      <td class="${dirCls(g.cplDir)}" style="font-weight:700">${g.cplChg}</td>
      <td>${g.cpsPrev||"—"}</td><td style="font-weight:700">${g.cpsCur||"—"}</td>
      <td class="${dirCls(g.cpsDir)}" style="font-weight:700">${g.cpsChg||"—"}</td>
      <td>${g.ctrChg}</td><td>${g.cvrChg}</td>
    </tr>`).join("");
  const chRows = w.channels.map(c => `
    <tr>
      <td class="camp-name">${c.name}</td>
      <td>${c.spend}</td><td>${c.leads}</td><td style="font-weight:700">${c.cpl}</td>
      <td style="font-weight:700">${c.cps||"—"}</td>
      <td>${c.ctr}</td><td>${c.cvr}</td>
      <td style="text-align:left">${c.note}</td>
    </tr>`).join("");
  const sumRows = w.summary.map(s => `
    <div style="display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:12px 16px;margin-bottom:8px">
      <span class="badge ${s.cls}" style="flex-shrink:0;margin-top:1px">${s.grade}</span>
      <span style="font-size:12px;line-height:1.6">${s.text}</span>
    </div>`).join("");
  const deepRows = w.deep.map(d => `
    <tr>
      <td class="camp-name">${d.item}</td>
      <td>${d.a}</td><td>${d.b}</td>
      <td class="${dirCls(d.dir)}" style="font-weight:700">${d.chg}</td>
    </tr>`).join("");
  return `
<div class="page" id="page-${w.id}">
  <div class="container">
    <div class="page-header">
      <h2>📅 ${w.title}</h2>
      <span class="subtitle">${w.compareLabel} · 메타 + 검색 통합</span>
    </div>

    ${w.overview ? `<div class="kpi-row" style="flex-wrap:wrap">
      <div class="kpi-card"><div class="kpi-label">총 광고비 (7일)</div><div class="kpi-value">${w.overview.spend}</div><div class="kpi-sub">메타+검색 합계</div>${w.overview.spendDelta?`<div class="kpi-delta">${w.overview.spendDelta}</div>`:""}</div>
      <div class="kpi-card"><div class="kpi-label">총 리드 / 통과</div><div class="kpi-value">${w.overview.leads}건</div><div class="kpi-sub">통과 ${w.overview.pass}건${w.overview.passNote||""}</div>${w.overview.leadsDelta?`<div class="kpi-delta">${w.overview.leadsDelta}</div>`:""}</div>
      <div class="kpi-card"><div class="kpi-label">평균 CPL</div><div class="kpi-value">${w.overview.cpl}</div><div class="kpi-sub">리드당</div>${w.overview.cplDelta?`<div class="kpi-delta ${w.overview.cplDir||""}">${w.overview.cplDelta}</div>`:""}</div>
      <div class="kpi-card"><div class="kpi-label">평균 CPS</div><div class="kpi-value">${w.overview.cps}</div><div class="kpi-sub">통과당${w.overview.cpsNote||""}</div>${w.overview.cpsDelta?`<div class="kpi-delta ${w.overview.cpsDir||""}">${w.overview.cpsDelta}</div>`:""}</div>
      <div class="kpi-card"><div class="kpi-label">평균 CTR</div><div class="kpi-value">${w.overview.ctr}</div><div class="kpi-sub">링크 클릭</div>${w.overview.ctrDelta?`<div class="kpi-delta ${w.overview.ctrDir||""}">${w.overview.ctrDelta}</div>`:""}</div>
    </div>` : ""}

    <div class="camp-section">
      <div class="section-hd">
        <span class="section-title">💰 광고비 대비 효율 — ${w.compareLabel}</span>
      </div>
      <div class="weekly-scroll">
      <table class="camp-table" style="min-width:1120px">
        <thead><tr>
          <th>구분</th>
          <th style="text-align:right">광고비 전주</th><th style="text-align:right">광고비 금주</th><th style="text-align:right">변화</th>
          <th style="text-align:right">CPL 전주</th><th style="text-align:right">CPL 금주</th><th style="text-align:right">CPL 변화</th>
          <th style="text-align:right">CPS 전주</th><th style="text-align:right">CPS 금주</th><th style="text-align:right">CPS 변화</th>
          <th style="text-align:right">CTR 변화</th><th style="text-align:right">CVR 변화</th>
        </tr></thead>
        <tbody>${groupRows}</tbody>
      </table>
      </div>
      <div style="font-size:10px;color:#999;margin-top:6px;line-height:1.7">${w.groupNotes.map(n => "· " + n).join("<br>")}</div>
    </div>

    <div class="camp-section">
      <div class="section-hd">
        <span class="section-title">📋 채널별 상세 (금주)</span>
        <span class="badge" style="background:#eef2ff;color:#3730a3">총 광고비 ${w.channelTotal}</span>
      </div>
      <div class="weekly-scroll">
      <table class="camp-table" style="min-width:760px">
        <thead><tr>
          <th>구분</th>
          <th style="text-align:right">광고비</th><th style="text-align:right">리드</th><th style="text-align:right">CPL</th>
          <th style="text-align:right">CPS</th>
          <th style="text-align:right">CTR</th><th style="text-align:right">CVR</th>
          <th>평가</th>
        </tr></thead>
        <tbody>${chRows}</tbody>
      </table>
      </div>
    </div>

    <div class="section">
      <div class="section-hd"><span class="section-title">💡 효율 요약</span></div>
      ${sumRows}
    </div>

    <div class="divider"></div>

    <div class="camp-section">
      <div class="section-hd">
        <span class="section-title">🟢 ${w.deepTitle}</span>
      </div>
      <table class="camp-table" style="max-width:680px">
        <thead><tr>
          <th>항목</th>
          <th style="text-align:right">${w.deepCols[0]}</th>
          <th style="text-align:right">${w.deepCols[1]}</th>
          <th style="text-align:right">${w.deepCols[2]}</th>
        </tr></thead>
        <tbody>${deepRows}</tbody>
      </table>
    </div>
  </div>
</div>`;
}

// ============================================================
// BOOT
// ============================================================
const pagesEl = document.getElementById("pages");
const tabsEl  = document.getElementById("dateTabs");
const weeklyEl = document.getElementById("weeklyTabs");
const monthlyEl = document.getElementById("monthlyTabs");
const sorted  = [...REPORTS].sort((a,b) => b.date.localeCompare(a.date));

sorted.forEach((r, i) => {
  pagesEl.innerHTML += renderPage(r);
  const btn = document.createElement("button");
  btn.className = "date-tab" + (i===0?" active":"");
  btn.textContent = r.label;
  btn.dataset.date = r.date;
  btn.onclick = () => switchTo(r.date);
  tabsEl.appendChild(btn);
});

[...MONTHLY].forEach(mo => {
  pagesEl.innerHTML += renderMonthlyPage(mo);
  const mb = document.createElement("button");
  mb.className = "date-tab weekly";
  mb.textContent = mo.label;
  mb.dataset.date = mo.id;
  mb.onclick = () => switchTo(mo.id);
  monthlyEl.appendChild(mb);
});

[...WEEKLY].reverse().forEach(w => {
  pagesEl.innerHTML += renderWeeklyPage(w);
  const btn = document.createElement("button");
  btn.className = "date-tab weekly";
  btn.textContent = w.label;
  btn.dataset.date = w.id;
  btn.onclick = () => switchTo(w.id);
  weeklyEl.appendChild(btn);
});

if (sorted.length > 0) {
  document.getElementById("page-" + sorted[0].date).classList.add("active");
}

function switchTo(date) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".date-tab").forEach(t => t.classList.remove("active"));
  document.getElementById("page-"+date).classList.add("active");
  document.querySelector(`[data-date="${date}"]`).classList.add("active");
  window.scrollTo({top:0, behavior:"smooth"});
}
</script>
</body>
