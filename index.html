<style>
  :root { color-scheme: light; }

  }

  /* === TOP NAV === */
  .topnav {
    position: sticky; top: 0; z-index: 200;
    background: rgba(245,245,247,0.95);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid #e0e0e0;
    padding: 0 24px;
  }
  .topnav-inner {
    max-width: 1180px; margin: 0 auto;
    display: flex; align-items: center; gap: 0; height: 56px;
  }
  .date-tabs {
    display: flex; gap: 2px; overflow-x: auto; flex: 1;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .date-tabs::-webkit-scrollbar { display: none; }
  .date-tab {
    font-size: 12px; font-weight: 600;
    padding: 6px 14px; border-radius: 8px;
    cursor: pointer; white-space: nowrap;
    border: none; background: transparent; color: #666;
    transition: all .15s;
  }
  .date-tab:hover { background: #e8e8e8; color: #1a1a1a; }
  .date-tab.active { background: #1a1a1a; color: #fff; }
  .date-tab.weekly { color: #0e7490; font-weight: 700; }
  .date-tab.weekly.active { background: #0e7490; color: #fff; }

  /* Twennies Logo */
  .twennies-logo {
    display: flex; align-items: center; margin-left: 16px; flex-shrink: 0;
  }

  /* === MAIN === */
  .page { display: none; padding: 28px 24px 64px; }
  .page.active { display: block; }
  .container { max-width: 1180px; margin: 0 auto; }

  /* === PAGE HEADER === */
  .page-header {
    display: flex; align-items: baseline; gap: 12px;
    margin-bottom: 20px; flex-wrap: wrap;
  }
  .page-header h2 { font-size: 20px; font-weight: 800; }
  .page-header .subtitle { font-size: 12px; color: #888; }

  /* === WEEKLY CPL TABLE === */
  .weekly-section { margin-bottom: 28px; }
  .weekly-section .sec-title {
    font-size: 13px; font-weight: 800; color: #1a1a1a;
    margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
  }
  .weekly-scroll { overflow-x: auto; }
  .weekly-table {
    border-collapse: collapse; font-size: 11px;
    min-width: 560px; width: 100%;
    background: #fff; border-radius: 12px; overflow: hidden;
    border: 1px solid #e5e5e5;
  }
  .weekly-table th {
    background: #f8f8f8; padding: 8px 12px;
    font-weight: 700; text-align: center; color: #555;
    border-bottom: 1px solid #e5e5e5;
    white-space: nowrap;
  }
  .weekly-table th.week-col { text-align: left; min-width: 90px; }
  .weekly-table td {
    padding: 7px 12px; text-align: center;
    border-bottom: 1px solid #f0f0f0; white-space: nowrap;
  }
  .weekly-table td.week-label {
    text-align: left; font-weight: 600; color: #666; font-size: 10px;
  }
  .weekly-table tr:last-child td { border-bottom: none; }
  .weekly-table tr:hover td { background: #fafafa; }
  .cpl-cell { font-weight: 700; font-size: 11px; }
  .cpl-high { color: #e03e3e; }
  .cpl-mid { color: #d97706; }
  .cpl-low { color: #1a9e5f; }
  .cpl-none { color: #ccc; }
  .avg-row td { background: #f8f8f8; font-size: 10px; color: #888; font-style: italic; }
  .avg-row td.week-label { font-weight: 700; color: #555; font-style: normal; }

  /* === KPI ROW === */
  .kpi-row {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 10px; margin-bottom: 20px;
  }
  .kpi-card {
    background: #fff; border-radius: 12px;
    padding: 16px 18px; border: 1px solid #e5e5e5;
  }
  .kpi-label { font-size: 10px; color: #999; margin-bottom: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
  .kpi-value { font-size: 24px; font-weight: 800; }
  .kpi-sub { font-size: 10px; color: #bbb; margin-top: 3px; }
  .kpi-card.c-red .kpi-value { color: #e03e3e; }
  .kpi-card.c-green .kpi-value { color: #1a9e5f; }
  .kpi-card.c-amber .kpi-value { color: #d97706; }

  /* === TARGET SUMMARY === */
  .target-row {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 10px; margin-bottom: 24px;
  }
  .ts-card {
    background: #fff; border-radius: 12px;
    padding: 14px 16px; border: 1px solid #e5e5e5;
  }
  .ts-name { font-size: 12px; font-weight: 700; margin-bottom: 8px; }
  .ts-row { display: flex; justify-content: space-between; font-size: 11px; color: #999; margin-bottom: 4px; }
  .ts-val { font-weight: 700; color: #1a1a1a; }
  .ts-val.red { color: #e03e3e; }
  .ts-val.green { color: #1a9e5f; }
  .ts-val.muted { color: #bbb; }
  .ts-divider { height: 1px; background: #f0f0f0; margin: 7px 0; }

  /* === CAMPAIGN TABLE === */
  .camp-section { margin-bottom: 28px; }
  .camp-table {
    border-collapse: collapse; font-size: 11px; width: 100%;
    background: #fff; border-radius: 12px; overflow: hidden;
    border: 1px solid #e5e5e5;
  }
  .camp-table th {
    background: #f8f8f8; padding: 8px 14px;
    font-weight: 700; text-align: left; color: #555;
    border-bottom: 1px solid #e5e5e5;
  }
  .camp-table th:not(:first-child) { text-align: right; }
  .camp-table td {
    padding: 8px 14px; border-bottom: 1px solid #f0f0f0;
    vertical-align: middle;
  }
  .camp-table td:not(:first-child) { text-align: right; font-weight: 600; }
  .camp-table tr:last-child td { border-bottom: none; }
  .camp-table tr:hover td { background: #fafafa; }
  .camp-name { font-weight: 600; color: #1a1a1a; }
  .camp-tag {
    display: inline-block; font-size: 9px; font-weight: 700;
    padding: 2px 6px; border-radius: 4px; margin-right: 6px;
    vertical-align: middle;
  }

  /* === SECTION === */
  .section { margin-bottom: 28px; }
  .section-hd { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .section-title { font-size: 14px; font-weight: 800; }
  .badge { font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 99px; }
  .b-red { background: #fde8e8; color: #c0392b; }
  .b-green { background: #e0f5ec; color: #1a7f4b; }
  .b-amber { background: #fef3c7; color: #92400e; }

  /* === AD CARDS === */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 10px; }
  .ad-card {
    background: #fff; border-radius: 12px;
    padding: 16px 18px; border: 1px solid #e5e5e5; border-left-width: 4px;
  }
  .ad-card.off { border-left-color: #e03e3e; }
  .ad-card.caution { border-left-color: #f59e0b; }
  .ad-card.good { border-left-color: #1a9e5f; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .ad-name { font-size: 12px; font-weight: 700; line-height: 1.45; flex: 1; padding-right: 8px; }
  .chip { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 5px; white-space: nowrap; flex-shrink: 0; }
  .chip-hhy { background: #ede9fe; color: #5b21b6; }
  .chip-hhm { background: #dbeafe; color: #1e40af; }
  .chip-hjm { background: #fce7f3; color: #9d174d; }
  .chip-hjf { background: #d1fae5; color: #065f46; }
  .metrics { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 10px; }
  .m-label { font-size: 9px; color: #bbb; margin-bottom: 1px; font-weight: 500; }
  .m-val { font-size: 13px; font-weight: 700; }
  .m-val.red { color: #e03e3e; }
  .m-val.green { color: #1a9e5f; }
  .m-val.amber { color: #d97706; }
  .bar-row { display: flex; align-items: center; gap: 8px; }
  .bar-bg { flex: 1; height: 4px; background: #f0f0f0; border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 99px; }
  .fill-red { background: #e03e3e; }
  .fill-amber { background: #f59e0b; }
  .fill-green { background: #1a9e5f; }
  .bar-label { font-size: 10px; color: #999; font-weight: 600; white-space: nowrap; }

  .divider { height: 1px; background: #ebebeb; margin: 20px 0 24px; }

  @media (max-width: 700px) {
    .kpi-row, .target-row { grid-template-columns: repeat(2, 1fr); }
    .cards { grid-template-columns: 1fr; }
  }
</style>

function fmtCPL(v) {
  if (v == null) return '<span class="cpl-none">—</span>';
  const s = Math.round(v/10000*10)/10;
  return (s % 1 === 0 ? s.toFixed(0) : s.toFixed(1)) + '만';
}

function cplClass(v, target) {
  if (v == null) return 'cpl-none';
  const avg = AVG_3M[target];
  if (!avg) return 'cpl-cell';
  if (v > avg * 1.2) return 'cpl-cell cpl-high';
  if (v < avg * 0.9) return 'cpl-cell cpl-low';
  return 'cpl-cell cpl-mid';
}

function renderWeeklyTable() {
  const targets = ['한한여','한한남','한일남','한일여'];
  const emojis  = { '한한여':'🟣','한한남':'🔵','한일남':'🩷','한일여':'🟢' };
  let html = `
  <div class="weekly-section">
    <div class="sec-title">📅 주차별 평균 CPL <span style="font-size:10px;font-weight:400;color:#aaa;margin-left:4px">월~일 기준 · 4/6~7/5 · 결과 기준 · 3M 평균 = 4/6~7/5</span></div>
    <div class="weekly-scroll">
    <table class="weekly-table">
      <thead><tr>
        <th class="week-col">주차</th>
        ${targets.map(t => `<th>${emojis[t]} ${t}</th>`).join('')}
      </tr></thead>
      <tbody>`;

  for (const row of WEEKLY_CPL) {
    html += `<tr><td class="week-label">${row.week}</td>`;
    for (const t of targets) {
      const v = row[t];
      html += `<td class="${cplClass(v,t)}">${fmtCPL(v)}</td>`;
    }
    html += `</tr>`;
  }

  // 3M avg row
  html += `<tr class="avg-row"><td class="week-label">3M 평균</td>`;
  for (const t of targets) {
    const avg = AVG_3M[t];
    html += `<td class="cpl-cell">${avg ? fmtCPL(avg) : '—'}</td>`;
  }
  html += `</tr></tbody></table></div></div>`;
  return html;
}

// ============================================================
// DAILY RESULTS TREND CHART (14일)
// ============================================================
function renderTrend(r) {
  if (!r.dailyTrend || !r.dailyTrend.length) return '';
  const days = r.dailyTrend;
  const W = 1120, H = 250, padL = 20, padR = 20, padT = 40, padB = 34;
  const cw = (W - padL - padR) / days.length;
  const maxRes = Math.max(...days.map(d => d.results), 1);
  const cpls = days.filter(d => d.cpl != null).map(d => d.cpl);
  const maxCpl = Math.max(...cpls, 1);
  let bars = '', labels = '', cplLabels = '';
  const pts = [];
  days.forEach((d, i) => {
    const x = padL + cw * i + cw * 0.5;
    const bh = (H - padT - padB) * d.results / maxRes;
    const bw = Math.min(cw * 0.5, 34);
    bars += `<rect x="${x - bw/2}" y="${H - padB - bh}" width="${bw}" height="${Math.max(bh,1)}" rx="3" fill="#6EC8D8" opacity="0.8"/>`;
    bars += `<text x="${x}" y="${H - padB - bh - 5}" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">${d.results}</text>`;
    labels += `<text x="${x}" y="${H - padB + 15}" text-anchor="middle" font-size="9" fill="#999">${d.d}</text>`;
    if (d.cpl != null) pts.push([x, padT + (H - padT - padB) * (1 - d.cpl / maxCpl), d.cpl]);
  });
  const line = `<polyline points="${pts.map(p => p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="#e03e3e" stroke-width="2" opacity="0.7"/>`;
  const dots = pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="#e03e3e"><title>CPL ${p[2].toLocaleString("ko-KR")}원</title></circle>`).join('');
  cplLabels = pts.map(p => `<text x="${p[0].toFixed(1)}" y="${(p[1]-7).toFixed(1)}" text-anchor="middle" font-size="8" fill="#e03e3e">${(p[2]/10000).toFixed(1)}만</text>`).join('');
  return `
  <div class="camp-section">
    <div class="section-hd">
      <span class="section-title">📈 일별 결과 추이 (최근 14일)</span>
      <span class="badge" style="background:#e0f2f7;color:#0e7490">막대: 일 결과 수 · 빨간 선: 일 CPL</span>
    </div>
    <div style="background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:14px 10px;overflow-x:auto">
      <svg viewBox="0 0 ${W} ${H}" style="min-width:680px;width:100%;display:block" xmlns="http://www.w3.org/2000/svg">
        ${bars}${line}${dots}${cplLabels}${labels}
        <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#e5e5e5"/>
      </svg>
    </div>
  </div>`;
}

    { item:"일본 리드",      a:"9건",         b:"14건",       chg:"▲ +5건",         dir:"good" },
    { item:"총 리드",        a:"9건",         b:"15건",       chg:"▲ +6건",         dir:"good" },
    { item:"일본 CPL",       a:"107,061원",   b:"25,678원",   chg:"개선 -76.0%",    dir:"good" },
    { item:"전체 CPL",       a:"143,033원",   b:"44,873원",   chg:"개선 -68.6%",    dir:"good" }
  ]
}
];

function renderWeeklyPage(w) {
  const dirCls = d => d === "good" ? "cpl-low" : d === "bad" ? "cpl-high" : "";
  const groupRows = w.groups.map(g => `
    <tr>
      <td class="camp-name">${g.grade} ${g.name}</td>
      <td>${g.spendPrev}</td><td>${g.spendCur}</td><td>${g.spendChg}</td>
      <td>${g.cplPrev}</td><td style="font-weight:700">${g.cplCur}</td>
      <td class="${dirCls(g.cplDir)}" style="font-weight:700">${g.cplChg}</td>
      <td>${g.ctrChg}</td><td>${g.cvrChg}</td>
    </tr>`).join("");
  const chRows = w.channels.map(c => `
    <tr>
      <td class="camp-name">${c.name}</td>
      <td>${c.spend}</td><td>${c.leads}</td><td style="font-weight:700">${c.cpl}</td>
      <td>${c.ctr}</td><td>${c.cvr}</td>
      <td style="text-align:left">${c.note}</td>
    </tr>`).join("");
  const sumRows = w.summary.map(s => `
    <div style="display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:12px 16px;margin-bottom:8px">
      <span class="badge ${s.cls}" style="flex-shrink:0;margin-top:1px">${s.grade}</span>
      <span style="font-size:12px;line-height:1.6">${s.text}</span>
    </div>`).join("");
  const deepRows = w.deep.map(d => `
    <tr>
      <td class="camp-name">${d.item}</td>
      <td>${d.a}</td><td>${d.b}</td>
      <td class="${dirCls(d.dir)}" style="font-weight:700">${d.chg}</td>
    </tr>`).join("");
  return `
<div class="page" id="page-${w.id}">
  <div class="container">
    <div class="page-header">
      <h2>📅 ${w.title}</h2>
      <span class="subtitle">${w.compareLabel} · 메타 + 검색 통합</span>
    </div>

    <div class="camp-section">
      <div class="section-hd">
        <span class="section-title">💰 광고비 대비 효율 — ${w.compareLabel}</span>
      </div>
      <div class="weekly-scroll">
      <table class="camp-table" style="min-width:860px">
        <thead><tr>
          <th>구분</th>
          <th style="text-align:right">광고비 전주</th><th style="text-align:right">광고비 금주</th><th style="text-align:right">변화</th>
          <th style="text-align:right">CPL 전주</th><th style="text-align:right">CPL 금주</th><th style="text-align:right">CPL 변화</th>
          <th style="text-align:right">CTR 변화</th><th style="text-align:right">CVR 변화</th>
        </tr></thead>
        <tbody>${groupRows}</tbody>
      </table>
      </div>
      <div style="font-size:10px;color:#999;margin-top:6px;line-height:1.7">${w.groupNotes.map(n => "· " + n).join("<br>")}</div>
    </div>

    <div class="camp-section">
      <div class="section-hd">
        <span class="section-title">📋 채널별 상세 (금주)</span>
        <span class="badge" style="background:#eef2ff;color:#3730a3">총 광고비 ${w.channelTotal}</span>
      </div>
      <div class="weekly-scroll">
      <table class="camp-table" style="min-width:760px">
        <thead><tr>
          <th>구분</th>
          <th style="text-align:right">광고비</th><th style="text-align:right">리드</th><th style="text-align:right">CPL</th>
          <th style="text-align:right">CTR</th><th style="text-align:right">CVR</th>
          <th>평가</th>
        </tr></thead>
        <tbody>${chRows}</tbody>
      </table>
      </div>
    </div>

    <div class="section">
      <div class="section-hd"><span class="section-title">💡 효율 요약</span></div>
      ${sumRows}
    </div>

    <div class="divider"></div>

    <div class="camp-section">
      <div class="section-hd">
        <span class="section-title">🟢 ${w.deepTitle}</span>
      </div>
      <table class="camp-table" style="max-width:680px">
        <thead><tr>
          <th>항목</th>
          <th style="text-align:right">${w.deepCols[0]}</th>
          <th style="text-align:right">${w.deepCols[1]}</th>
          <th style="text-align:right">${w.deepCols[2]}</th>
        </tr></thead>
        <tbody>${deepRows}</tbody>
      </table>
    </div>
  </div>
</div>`;
}

// ============================================================
// BOOT
// ============================================================
const pagesEl = document.getElementById("pages");
const tabsEl  = document.getElementById("dateTabs");
const sorted  = [...REPORTS].sort((a,b) => b.date.localeCompare(a.date));

sorted.forEach((r, i) => {
  pagesEl.innerHTML += renderPage(r);
  const btn = document.createElement("button");
  btn.className = "date-tab" + (i===0?" active":"");
  btn.textContent = r.label;
  btn.dataset.date = r.date;
  btn.onclick = () => switchTo(r.date);
  tabsEl.appendChild(btn);
});

[...WEEKLY].reverse().forEach(w => {
  pagesEl.innerHTML += renderWeeklyPage(w);
  const btn = document.createElement("button");
  btn.className = "date-tab weekly";
  btn.textContent = w.label;
  btn.dataset.date = w.id;
  btn.onclick = () => switchTo(w.id);
  tabsEl.insertBefore(btn, tabsEl.firstChild);
});

if (sorted.length > 0) {
  document.getElementById("page-" + sorted[0].date).classList.add("active");
}

function switchTo(date) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".date-tab").forEach(t => t.classList.remove("active"));
  document.getElementById("page-"+date).classList.add("active");
  document.querySelector(`[data-date="${date}"]`).classList.add("active");
  window.scrollTo({top:0, behavior:"smooth"});
}
</script>
</body>
</html>
